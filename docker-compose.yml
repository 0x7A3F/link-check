services:
  backend:
    build: ./apps/backend
    restart: unless-stopped
    environment:
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s

  frontend:
    build: ./apps/frontend
    restart: unless-stopped
    environment:
      NUXT_PUBLIC_API_BASE: http://backend:8000
      NUXT_TURNSTILE_SECRET_KEY: ${NUXT_TURNSTILE_SECRET_KEY:-}
      NUXT_PUBLIC_TURNSTILE_SITE_KEY: ${NUXT_PUBLIC_TURNSTILE_SITE_KEY:-}
      NUXT_RESEND_API_KEY: ${NUXT_RESEND_API_KEY:-}
      NUXT_REPORT_TO_EMAIL: ${NUXT_REPORT_TO_EMAIL:-}
      NUXT_EMAIL_FROM: ${NUXT_EMAIL_FROM:-}
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy
